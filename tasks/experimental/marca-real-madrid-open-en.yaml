schema_version: 1
id: marca-real-madrid-open-en
start_url: https://www.marca.com/
instruction: |
  1. Find a currently published news article in Marca's futbol/real-madrid section.
  2. Use the site's own navigation or search; do not use an external search engine.
  3. Open the article.
  4. Return JSON with "name" (exact headline) and "url" (final article URL).
     Tracking query parameters and fragments may be omitted from the article URL.
     Put this JSON in your final response (restricted runner: result; MCP: summary).
  5. Finish.
completion: The final page is a Marca article about Real Madrid and the response includes its exact headline and URL.
policy:
  allowed_domains: [www.marca.com, marca.com]
  risk: read_only
  allow_form_submit: false
max_actions: 48
timeout_seconds: 300
verification_mode: task_completion
acceptance:
  verifier: marca_article
