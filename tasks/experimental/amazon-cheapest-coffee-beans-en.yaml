schema_version: 1
id: amazon-cheapest-coffee-beans-en
start_url: https://www.amazon.es/
instruction: |
  1. Reject non-essential cookies if a consent banner appears.
  2. Search Amazon.es for "cafe en grano".
  3. From the first results page, open a coffee-bean product.
  4. Find a product with a displayed unit price strictly below 14 EUR/kg in its
     main price block. Ignore recommendations, coupon and subscription prices.
     You may inspect another product from that first page.
  5. Leave the qualifying product page open.
  6. Return JSON with "name" (exact product title), "url" (URL of the opened product;
     a canonical /dp/ASIN URL is accepted),
     and "eur_per_kg" (displayed unit price as a JSON number, e.g. 12.99).
     Put this JSON in your final response (restricted runner: result; MCP: summary).
  7. Do not add to cart, log in, subscribe, enter personal data or purchase anything.
completion: A coffee-bean product page is open with a visible unit price below 14 EUR/kg; the response gives its exact name, final URL and unit price.
policy:
  allowed_domains: [www.amazon.es, amazon.es]
  risk: read_only
  allow_form_submit: false
  allowed_submit_labels: [Buscar Amazon.es, Buscar en Amazon.es, Search Amazon.es]
max_actions: 48
timeout_seconds: 300
verification_mode: task_completion
acceptance:
  verifier: amazon_coffee_under_14
