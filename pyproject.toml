[project]
name = "browser-agent-evaluation"
version = "0.1.0"
description = "Isolated, approval-gated browser-agent comparison laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "browser-use==0.13.8",
    "httpx>=0.27",
    "mcp>=1.0",
    "playwright==1.62.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agent_evaluation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["browser_agent_evaluation"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
